schema_version: 1
id: truthiness-default-overrides-valid-values
name: 真值回退覆盖有效值
definition: 默认值逻辑使用真值判断，而业务仅将 null 或 undefined 视为缺失，导致合法的假值被默认值覆盖。
counter_examples:
  - 业务明确规定 0 表示未配置并应触发默认值时，使用逻辑或回退不属于此机制。
status: active
merged_into: null
